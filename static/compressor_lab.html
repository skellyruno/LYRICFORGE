<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SkellyMotion compressor lab</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#101615;color:#e7f0e7;font:14px system-ui,sans-serif}h1{font-size:19px;letter-spacing:.03em;margin:0 0 4px}p{font-size:12px;color:#a5b8aa;margin:4px 0 12px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}label{display:grid;grid-template-columns:1fr auto;gap:3px;font-size:12px}input{grid-column:1/-1;width:100%;accent-color:#a0f58c}output{color:#a0f58c;font-variant-numeric:tabular-nums}canvas{width:100%;height:auto;display:block;border:1px solid #33483b;border-radius:8px;background:#19241e;margin-top:12px}.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}.meters div{background:#19241e;border-radius:5px;padding:8px;font-size:11px;color:#a5b8aa}.meters strong{display:block;color:#e7f0e7;font-size:18px;white-space:nowrap}button{background:#19241e;color:#a0f58c;border:1px solid #33483b;border-radius:5px;padding:6px 10px;font:inherit;cursor:pointer}.legend{display:flex;gap:12px;font-size:11px;margin-top:5px;flex-wrap:wrap}.legend span:nth-child(1){color:#70a9e9}.legend span:nth-child(2){color:#a0f58c}.legend span:nth-child(3){color:#f5b942} @media(max-width:240px){.controls{grid-template-columns:1fr}.meters{grid-template-columns:1fr}}
</style><h1>Compression lab</h1><p>Live numerical model · synthetic signal · not a measured plugin response</p><div class="controls"><label>Threshold <output id="thresholdOut"></output><input id="threshold" type="range" min="-48" max="0" step="1" value="-18"></label><label>Ratio <output id="ratioOut"></output><input id="ratio" type="range" min="1" max="20" step=".5" value="4"></label><label>Attack <output id="attackOut"></output><input id="attack" type="range" min="1" max="500" value="30"></label><label>Release <output id="releaseOut"></output><input id="release" type="range" min="10" max="2000" step="10" value="200"></label></div><canvas id="scope" width="700" height="410" aria-label="Moving input and output level histories, gain reduction and transfer curve"></canvas><div class="legend"><span>● Input</span><span>● Output</span><span>● Threshold / gain reduction</span></div><div class="meters"><div>Input<strong id="inLevel">—</strong></div><div>Output<strong id="outLevel">—</strong></div><div>Reduction<strong id="grLevel">—</strong></div></div><button id="toggle">Pause</button> <button id="reset">Reset</button><script>
'use strict';const $=id=>document.getElementById(id),cv=$('scope'),ctx=cv.getContext('2d'),C={blue:'#70a9e9',green:'#a0f58c',gold:'#f5b942',grid:'#33483b',muted:'#a5b8aa'};let t=0,gain=0,history=[],paused=false,last=performance.now(),remainder=0;
function demoSettings(){return {threshold:+$('threshold').value,ratio:+$('ratio').value,attack_ms:+$('attack').value,release_ms:+$('release').value};}window.demoSettings=demoSettings;
function labels(){const p=demoSettings();$('thresholdOut').textContent=p.threshold+' dB';$('ratioOut').textContent=p.ratio+':1';$('attackOut').textContent=p.attack_ms+' ms';$('releaseOut').textContent=p.release_ms+' ms';}document.querySelectorAll('input').forEach(el=>el.addEventListener('input',labels));labels();
function step(p){const level=Math.min(-1,-32+25*Math.pow(.5+.5*Math.sin(2*Math.PI*t/.98-.7),1.5)+4*Math.exp(-Math.pow((t%1.96-.5)/.055,2)));const target=-Math.max(0,level-p.threshold)*(1-1/p.ratio),a=Math.exp(-1/(target<gain?p.attack_ms:p.release_ms));gain=a*gain+(1-a)*target;t+=.001;return [level,level+gain,Math.max(0,-gain)];}
function line(points,color,width=2){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}function txt(x,y,s,color=C.muted,size=13){ctx.fillStyle=color;ctx.font=size+'px system-ui';ctx.fillText(s,x,y);}
function chart(x,y,w,h,lo,hi,ticks){const xy=(a,b)=>[x+a*w,y+h-(Math.max(lo,Math.min(hi,b))-lo)/(hi-lo)*h];for(const k of ticks){const yy=xy(0,k)[1];line([[x,yy],[x+w,yy]],C.grid,1);txt(x-38,yy+4,String(k),C.muted,12);}for(let i=0;i<=4;i++)line([[x+i*w/4,y],[x+i*w/4,y+h]],C.grid,1);return xy;}
function draw(p){ctx.clearRect(0,0,700,410);txt(48,25,'LEVEL HISTORY / dB');const xy=chart(48,48,610,134,-48,0,[-48,-36,-24,-12,0]);line([xy(0,p.threshold),xy(1,p.threshold)],C.gold);for(let k=0;k<2;k++)line(history.map((r,i)=>xy(i/Math.max(1,history.length-1),r[k])),k?C.green:C.blue,3);txt(48,213,'GAIN REDUCTION / dB');const maxGR=Math.max(18,Math.ceil((-p.threshold*(1-1/p.ratio))/6)*6);let gr=chart(48,233,300,124,0,maxGR,[0,maxGR/2,maxGR]);line(history.map((r,i)=>gr(i/Math.max(1,history.length-1),r[2])),C.gold,3);txt(408,213,'TRANSFER / dB');let tr=chart(408,233,250,124,-48,0,[-48,-24,0]);line([tr(0,-48),tr(1,0)],C.muted,1);line(Array.from({length:101},(_,i)=>{let x=-48+i*.48;return tr(i/100,x-Math.max(0,x-p.threshold)*(1-1/p.ratio));}),C.green,3);const r=history.at(-1)||[-48,-48,0],pt=tr((r[0]+48)/48,r[1]);ctx.fillStyle=C.gold;ctx.beginPath();ctx.arc(pt[0],pt[1],5,0,Math.PI*2);ctx.fill();txt(408,385,'Input → output');$('inLevel').textContent=r[0].toFixed(1)+' dB';$('outLevel').textContent=r[1].toFixed(1)+' dB';$('grLevel').textContent=r[2].toFixed(1)+' dB';}
function tick(now){const p=demoSettings();const visible=!document.hidden&&(!window.frameElement||window.frameElement.getClientRects().length>0);if(!paused&&visible){remainder+=Math.min(.1,(now-last)/1000);while(remainder>=.01){let r;for(let i=0;i<10;i++)r=step(p);history.push(r);if(history.length>201)history.shift();remainder-=.01;}}last=now;if(visible)draw(p);requestAnimationFrame(tick);}requestAnimationFrame(tick);$('toggle').onclick=()=>{paused=!paused;$('toggle').textContent=paused?'Resume':'Pause'};$('reset').onclick=()=>{t=0;gain=0;history=[];remainder=0;for(const [id,value] of Object.entries({threshold:-18,ratio:4,attack:30,release:200}))$(id).value=value;labels()};
</script></html>
