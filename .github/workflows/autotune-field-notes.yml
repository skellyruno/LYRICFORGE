name: Skell Science AutoTune V2 directed narration
on:
  push:
    branches: [staging/skell-science-autotune-v2-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skelliere-film-voice-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install optional neural runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libespeak-ng1
          python -m pip install 'kokoro-onnx==0.6.1' 'onnxruntime==1.22.1' 'numpy==2.2.6'
      - uses: actions/cache@v4
        with:
          path: .voice-model-cache
          key: kokoro-v1.0-fp32-beb0d184-voices-bca610b8
      - name: Verify pinned voice model
        run: |
          set -euo pipefail
          mkdir -p .voice-model-cache
          cd .voice-model-cache
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          printf '%s  %s\n' beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a kokoro-v1.0.onnx bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d voices-v1.0.bin > SHA256SUMS
          for file in kokoro-v1.0.onnx voices-v1.0.bin; do
            if ! grep "  $file$" SHA256SUMS | sha256sum -c -; then
              curl --fail --location --retry 2 --max-time 180 "$base/$file" -o "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done
          sha256sum -c SHA256SUMS
      - name: Generate actual neural narration
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          LYRICFORGE_KOKORO_THREADS: '2'
        run: |
          python field-notes/inference/autotune_v2_voice.py .voice-model-cache/kokoro-v1.0.onnx .voice-model-cache/voices-v1.0.bin narration
          git rev-parse HEAD > narration/producer-revision.txt
      - uses: actions/upload-artifact@v6
        with:
          name: SkellScience-AutoTune-V2-Voice
          path: narration/
          if-no-files-found: error
          retention-days: 7
