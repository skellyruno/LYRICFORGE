name: Creator source browser interaction and screenshot proof
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths: ['packaging/release-audit/creator_browser.py','.github/workflows/creator-browser-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creator-browser-proof-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Actual source browser interaction and captures
        run: python packaging/release-audit/creator_browser.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: creator-browser-evidence
          path: creator-ui-evidence/
          if-no-files-found: warn
