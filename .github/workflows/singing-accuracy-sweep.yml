name: Held-out real singing recognition improvement
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths: ['packaging/release-audit/singing_accuracy_sweep.py','.github/workflows/singing-accuracy-sweep.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: singing-accuracy-sweep-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  accuracy:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: singing-accuracy-evidence
          run-id: 46067996723
          github-token: ${{ github.token }}
          path: prior-singing
      - uses: actions/download-artifact@v4
        with:
          name: compact-ffmpeg-runtime-and-source
          run-id: 46040313923
          github-token: ${{ github.token }}
          path: tools
      - run: python -m pip install -r requirements-desktop.txt "faster-whisper==1.2.1" "av==18.1.1" "ctranslate2==4.9.1" "numpy==2.4.6"
      - name: Compare real singing settings on separate artists using actual direct backend
        shell: pwsh
        run: |
          python packaging/shared-media/shared_media_proof.py model singing-model
          if ($LASTEXITCODE -ne 0) { throw 'Pinned model failed' }
          python packaging/direct-media/stage_direct_candidate.py . singing-stage
          if ($LASTEXITCODE -ne 0) { throw 'Candidate staging failed' }
          python -m pip uninstall -y av
          if ($LASTEXITCODE -ne 0) { throw 'Candidate isolation failed' }
          $env:PATH="$((Resolve-Path tools).Path);$env:PATH"
          $env:PYTHONPATH="$((Resolve-Path singing-stage).Path);$((Resolve-Path packaging/shared-media).Path)"
          python packaging/release-audit/singing_accuracy_sweep.py prior-singing/original.json singing-model singing-sweep
          if ($LASTEXITCODE -ne 0) { throw 'Singing accuracy comparison failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: heldout-singing-accuracy-evidence
          path: singing-sweep/*.json
          if-no-files-found: warn
