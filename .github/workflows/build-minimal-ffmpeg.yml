name: Compact FFmpeg / verified installer gate
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths:
      - '.github/workflows/build-minimal-ffmpeg.yml'
      - 'packaging/compact-media/**'
      - 'packaging/compact_ffmpeg_payload.py'
      - 'packaging/compact-media-installer.ps1'
      - 'packaging/capture-rendered-ui.ps1'
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: 'Official FFmpeg source tag'
        default: 'n9.0.2'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: compact-ffmpeg-retry-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  recapture:
    # Previous run's independent screenshot job may finish without interruption.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: SkellyMotion-Consolidated-Windows-x64
          run-id: 46032977554
          github-token: ${{ github.token }}
          path: dist/SkellyMotion
      - uses: actions/download-artifact@v4
        with:
          name: SkellyMotion-Compact-Windows-Setup
          run-id: 46037459939
          github-token: ${{ github.token }}
          path: existing-setup
      - name: Verify prior installer and recapture painted UI
        shell: pwsh
        run: ./packaging/compact-media-installer.ps1 -ExistingSetup existing-setup/SkellyMotion-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-setup-painted-ui-evidence
          path: compact-media-evidence/
          if-no-files-found: warn
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FFMPEG_REF: ${{ inputs.ffmpeg_ref || 'n9.0.2' }}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm
            mingw-w64-x86_64-x264 mingw-w64-x86_64-libass mingw-w64-x86_64-zlib mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-libvpx mingw-w64-x86_64-dav1d mingw-w64-x86_64-opus mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-ffnvcodec-headers mingw-w64-x86_64-amf-headers mingw-w64-x86_64-libvpl
      - name: Build compact FFmpeg with full native decoder and filter sets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          [[ "$FFMPEG_REF" =~ ^n[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          git clone --depth 1 --branch "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          # Preserve native decoders/demuxers/parsers/muxers/filters/BSFs.
          # Limit encoding to the app's actual export modes and regression fixtures.
          ./configure \
            --arch=x86_64 --target-os=mingw32 --pkg-config-flags=--static \
            --extra-ldflags=-static --disable-shared --enable-static \
            --enable-gpl --disable-debug --disable-doc --disable-ffplay \
            --disable-autodetect --disable-network \
            --enable-zlib --enable-iconv --enable-libx264 --enable-libass \
            --enable-libvpx --enable-libdav1d --enable-libopus --enable-libvorbis \
            --enable-ffnvcodec --enable-nvenc --enable-amf --enable-libvpl --enable-d3d11va --enable-dxva2 \
            --disable-encoders \
            --enable-encoder=libx264,aac,rawvideo,png,mjpeg,gif,wrapped_avframe,libvpx_vp8,libvpx_vp9,h264_nvenc,h264_qsv,h264_amf \
            '--enable-encoder=pcm_*' \
            --disable-indevs --disable-outdevs --enable-indev=lavfi
          make -j"$(nproc)"
          mkdir -p ../compact-ffmpeg
          cp ffmpeg.exe ffprobe.exe ../compact-ffmpeg/
          strip ../compact-ffmpeg/ffmpeg.exe ../compact-ffmpeg/ffprobe.exe
          git rev-parse HEAD > ../compact-ffmpeg/source-revision.txt
          git archive --format=tar.gz --prefix=ffmpeg/ HEAD > ../compact-ffmpeg/ffmpeg-source.tar.gz
          cp COPYING* LICENSE* ../compact-ffmpeg/ || true
          cp config.log ../compact-ffmpeg/ 2>/dev/null || cp ffbuild/config.log ../compact-ffmpeg/
          pacman -Q > ../compact-ffmpeg/msys2-packages.txt
          ./ffmpeg.exe -hide_banner -buildconf > ../compact-ffmpeg/buildconf.txt 2>&1
          objdump -p ../compact-ffmpeg/ffmpeg.exe > ../compact-ffmpeg/pe-imports.txt
          sha256sum ../compact-ffmpeg/*.exe > ../compact-ffmpeg/executables.sha256
      - name: Check Windows loader with only the normal system path
        shell: pwsh
        run: |
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
          & ./compact-ffmpeg/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Not a standalone FFmpeg executable' }
          & ./compact-ffmpeg/ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Not a standalone ffprobe executable' }
      - uses: actions/upload-artifact@v4
        with:
          name: compact-ffmpeg-runtime-and-source
          path: compact-ffmpeg/
          retention-days: 30
          if-no-files-found: error
  validate:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: compact-ffmpeg-runtime-and-source
          path: compact-ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: SkellyMotion-Consolidated-Windows-x64
          run-id: 46032977554
          github-token: ${{ github.token }}
          path: dist/SkellyMotion
      - name: Install exact consolidated source test dependencies
        run: python -m pip install -r requirements-desktop.txt pytest httpx "pywebview>=5.4,<7" "pythonnet==3.0.5" "clr-loader==0.2.7.post0"
      - name: Compare decoded reference media and capabilities
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python packaging/compact-media/audit_media.py dist/SkellyMotion/_internal/tools/ffmpeg.exe compact-ffmpeg/ffmpeg.exe compact-media-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Candidate media comparison failed' }
      - name: Compare actual encoded ASS cinematic and audio filter output
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python packaging/compact-media/render_parity.py dist/SkellyMotion/_internal/tools/ffmpeg.exe compact-ffmpeg/ffmpeg.exe compact-media-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Encoded media parity failed' }
      - name: Run full consolidated test suite using compact FFmpeg only
        shell: pwsh
        run: |
          $dir=(Resolve-Path compact-ffmpeg).Path
          $env:PATH="$dir;$env:PATH"
          if ((Get-Command ffmpeg).Source -ne (Join-Path $dir 'ffmpeg.exe')) { throw 'Wrong FFmpeg selected' }
          if ((Get-Command ffprobe).Source -ne (Join-Path $dir 'ffprobe.exe')) { throw 'Wrong ffprobe selected' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Full application regression failed' }
      - name: Build and test installer changing only the verified FFmpeg executable
        shell: pwsh
        run: ./packaging/compact-media-installer.ps1 -Candidate compact-ffmpeg/ffmpeg.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ffmpeg-validation-evidence
          path: |
            compact-media-evidence/*.json
            compact-media-evidence/*.png
            compact-media-evidence/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: SkellyMotion-Compact-Media-Windows-Setup
          path: dist/installer/SkellyMotion-Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
