name: Field Notes / explicit neural narration
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths:
      - 'field-notes/candidates/SkellyMotion-Editorial-V19-Source-Candidate.zip'
      - '.github/workflows/field-notes-narration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: field-notes-voice-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify candidate archive
        run: |
          printf '%s  %s\n' 'c687d9558d64000f972a5c740697d3669d1457cbb09fd5e4f7fe286e9a00b4e4' 'field-notes/candidates/SkellyMotion-Editorial-V19-Source-Candidate.zip' | sha256sum -c -
          unzip -q 'field-notes/candidates/SkellyMotion-Editorial-V19-Source-Candidate.zip' -d candidate
      - name: Install explicit optional neural runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg libespeak-ng1
          python -m pip install 'kokoro-onnx==0.6.1' 'onnxruntime==1.22.1' 'numpy==2.2.6'
      - uses: actions/cache@v4
        with:
          path: .voice-model-cache
          key: kokoro-v1.0-fp32-beb0d184-voices-bca610b8
      - name: Verify previously pinned model files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .voice-model-cache
          cd .voice-model-cache
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
          printf '%s  %s\n' beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a kokoro-v1.0.onnx bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d voices-v1.0.bin > SHA256SUMS
          for file in kokoro-v1.0.onnx voices-v1.0.bin; do
            if ! grep "  $file$" SHA256SUMS | sha256sum -c -; then
              curl --fail --location --retry 2 --max-time 180 "$base/$file" -o "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done
          sha256sum -c SHA256SUMS
      - name: Synthesize new Field Notes 05 script and assemble exact chapter clock
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          LYRICFORGE_KOKORO_THREADS: '2'
        run: |
          python candidate/LYRICFORGE-main/examples/time_narration.py .voice-model-cache/kokoro-v1.0.onnx .voice-model-cache/voices-v1.0.bin narration
          git rev-parse HEAD > narration/producer-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Field-Notes-05-Kokoro-Michael
          path: narration/
          retention-days: 14
          if-no-files-found: error
