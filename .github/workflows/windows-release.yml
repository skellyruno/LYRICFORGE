name: Build SkellyMotion Windows app
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/windows-startup-hang-recovery
    paths:
      - 'desktop_launcher.py'
      - 'server.py'
      - 'studio_performance.py'
      - 'static/**'
      - 'Repair-SkellyMotion.cmd'
      - 'SkellyMotion-SafeMode.cmd'
      - 'SkellyMotion-BrowserMode.cmd'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/windows-release.yml'
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest httpx "pywebview>=5.4,<7" "pythonnet==3.0.5" "clr-loader==0.2.7.post0"
      - name: Verify editor JavaScript
        shell: pwsh
        run: |
          node --check static/app.js
          node tests/editor_smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Editor JavaScript syntax check failed' }
      - name: Download verified FFmpeg with libass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Use one known-good STATIC build, not whichever ffmpeg.exe happens to be on PATH.
          # Gyan essentials 9.0.2 includes libass and libx264.
          $url = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip'
          $expectedSha256 = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-essentials_build.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 5
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) { throw "FFmpeg SHA-256 mismatch: $actualSha256" }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter ffmpeg.exe -File |
            Where-Object { $_.DirectoryName -like '*bin' } |
            Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem -Path $extract -Recurse -Filter ffprobe.exe -File |
            Where-Object { $_.DirectoryName -like '*bin' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Verified FFmpeg archive is missing ffmpeg.exe or ffprobe.exe' }
          # Do not parse ffmpeg -filters output: flag formatting changes between versions.
          # Render an actual ASS subtitle into H.264 to verify BOTH libass and libx264.
          $smokeDir = Join-Path $env:RUNNER_TEMP 'lyricforge-ass-smoke'
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $assText = @'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 320
          PlayResY: 180

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Arial,34,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,-1,0,0,0,100,100,0,0,1,1,0,5,10,10,10,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          Dialogue: 0,0:00:00.00,0:00:00.40,Default,,0,0,0,,SKELLYMOTION TEST
          '@
          Set-Content -Path (Join-Path $smokeDir 'smoke.ass') -Value $assText -Encoding utf8
          Push-Location $smokeDir
          try {
            $smokeLog = & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=320x180:r=25:d=0.5' -vf 'ass=smoke.ass' -frames:v 3 -c:v libx264 -pix_fmt yuv420p 'smoke.mp4' 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg cannot render ASS lyric subtitles: $smokeLog" }
            if (-not (Test-Path 'smoke.mp4') -or (Get-Item 'smoke.mp4').Length -lt 500) {
              throw 'FFmpeg exited without producing a valid subtitle test video'
            }
            $probeResult = & $ffprobe -v error -show_entries format=duration -of 'default=noprint_wrappers=1:nokey=1' 'smoke.mp4' 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or -not $probeResult.Trim()) { throw "ffprobe failed to validate the test video: $probeResult" }
            Write-Host "FFmpeg ASS subtitle rendering and H.264 encoding passed ($probeResult seconds)."
          } finally {
            Pop-Location
          }
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          Copy-Item -Path $ffmpeg -Destination vendor/ffmpeg/ffmpeg.exe
          Copy-Item -Path $ffprobe -Destination vendor/ffmpeg/ffprobe.exe
          # Subsequent tests and tools must use the SAME FFmpeg that we package.
          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path vendor/ffmpeg).Path
          & (Resolve-Path vendor/ffmpeg/ffmpeg.exe).Path -hide_banner -version | Select-Object -First 1
      - name: Validate editor JavaScript syntax
        run: node --check static/app.js
      - name: Test original editor on Windows
        run: python -m pytest tests -q
      - name: Build self-contained Windows folder
        shell: pwsh
        run: |
          # FFprobe is needed only on the CI runner for the source archive
          # test. The portable app uses the already-bundled PyAV to probe
          # durations and image/video streams, eliminating ~100 MB extracted.
          pyinstaller --noconfirm --clean --onedir --windowed --name SkellyMotion `
            --add-data "static;static" `
            --add-binary "vendor/ffmpeg/ffmpeg.exe;tools" `
            --hidden-import clr `
            --hidden-import webview `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import faster_whisper `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all av `
            --exclude-module onnxruntime `
            desktop_launcher.py
      - name: Measure bundle size and identify large dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'dist/SkellyMotion').Path
          $all = @(Get-ChildItem -LiteralPath $root -Recurse -File)
          $total = ($all | Measure-Object -Property Length -Sum).Sum
          Write-Host ("BUNDLE_SIZE_MB={0:N2}" -f ($total / 1MB))
          Write-Host 'Largest bundled files:'
          $all | Sort-Object Length -Descending | Select-Object -First 30 |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length + 1)
              Write-Host ("  {0,8:N2} MB  {1}" -f ($_.Length / 1MB), $relative)
            }
          Write-Host 'Top-level internal dependency sizes:'
          $internal = Join-Path $root '_internal'
          Get-ChildItem -LiteralPath $internal | ForEach-Object {
            $bytes = if ($_.PSIsContainer) {
              (Get-ChildItem -LiteralPath $_.FullName -Recurse -File |
                Measure-Object -Property Length -Sum).Sum
            } else { $_.Length }
            [PSCustomObject]@{Name=$_.Name; MB=[math]::Round($bytes/1MB,2)}
          } | Sort-Object MB -Descending | Select-Object -First 30 |
            Format-Table -AutoSize | Out-String | Write-Host
      - name: Smoke test packaged Windows GUI program
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/SkellyMotion/SkellyMotion.exe').Path
          $log = Join-Path $env:LOCALAPPDATA 'LyricForge/logs/desktop.log'
          Write-Host "Running GUI executable self-test: $exe"
          # PowerShell can launch Win32 GUI programs asynchronously with &.
          # Start-Process -Wait -PassThru gives us the exit code of this exact process.
          $testProcess = Start-Process -FilePath $exe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          $code = $testProcess.ExitCode
          Write-Host "SkellyMotion GUI self-test exit code: $code"
          if (Test-Path $log) {
            Write-Host '----- SkellyMotion self-test output -----'
            Get-Content -Path $log -Tail 120
            Write-Host '----- end self-test output -----'
          }
          if ($code -ne 0) {
            throw "SkellyMotion.exe smoke test exited with code $code"
          }
          Write-Host 'SkellyMotion portable GUI self-test completed successfully.'
      - name: Verify bundled Whisper inference engine loads without VAD runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/SkellyMotion/SkellyMotion.exe').Path
          $folder = Split-Path $exe
          # Whisper uses word timestamps with vad_filter=False in the app;
          # onnxruntime's 40+ MB Silero VAD backend is not executed.
          # Import the real transcriber and CPU inference extension in the
          # frozen EXE to catch missing CTranslate2 / tokenizer dependencies.
          $process = Start-Process -FilePath $exe -ArgumentList '--ai-self-test' -WorkingDirectory $folder -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'LyricForge/logs/desktop.log'
            if (Test-Path $log) { Get-Content -Path $log -Tail 65 }
            throw "Frozen Whisper/CTranslate2 import test failed: $($process.ExitCode)"
          }
          Write-Host 'Bundled Whisper and CTranslate2 import self-test passed'
      - name: Verify packaged native Python.NET runtime and ship targeted repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/SkellyMotion').Path
          $managedAssemblies = @(
            '_internal/pythonnet/runtime/Python.Runtime.dll',
            '_internal/webview/lib/Microsoft.Web.WebView2.Core.dll',
            '_internal/webview/lib/Microsoft.Web.WebView2.WinForms.dll'
          )
          foreach ($relativePath in $managedAssemblies) {
            $dll = Join-Path $folder $relativePath
            if (-not (Test-Path -LiteralPath $dll)) {
              throw "PyInstaller did not bundle required managed UI DLL: $relativePath"
            }
            $bytes = (Get-Item -LiteralPath $dll).Length
            if ($bytes -lt 4096) {
              throw "Bundled managed UI assembly is truncated ($bytes bytes): $relativePath"
            }
            # Real WebView2 WinForms assemblies can be ~39KB; verify PE/MZ
            # format rather than wrongly assuming every DLL exceeds 50KB.
            $stream = [System.IO.File]::OpenRead($dll)
            try {
              $first = $stream.ReadByte()
              $second = $stream.ReadByte()
            } finally { $stream.Dispose() }
            if ($first -ne 77 -or $second -ne 90) {
              throw "Bundled UI file is not a valid Windows DLL: $relativePath"
            }
          }
          Copy-Item -LiteralPath 'Repair-SkellyMotion.cmd' -Destination (Join-Path $folder 'Repair-SkellyMotion.cmd')
          Copy-Item -LiteralPath 'SkellyMotion-SafeMode.cmd' -Destination (Join-Path $folder 'SkellyMotion-SafeMode.cmd')
          Copy-Item -LiteralPath 'SkellyMotion-BrowserMode.cmd' -Destination (Join-Path $folder 'SkellyMotion-BrowserMode.cmd')
          if (-not (Test-Path (Join-Path $folder 'Repair-SkellyMotion.cmd'))) {
            throw 'Trusted Windows runtime repair helper was not packaged'
          }
          foreach ($helper in @('SkellyMotion-SafeMode.cmd', 'SkellyMotion-BrowserMode.cmd')) {
            if (-not (Test-Path (Join-Path $folder $helper))) {
              throw "Missing recovery mode launcher: $helper"
            }
          }
          $exe = Join-Path $folder 'SkellyMotion.exe'
          $log = Join-Path $env:LOCALAPPDATA 'LyricForge/logs/desktop.log'
          Write-Host "Validating Python.NET plus Core/WinForms WebView2 assemblies"
          $process = Start-Process -FilePath $exe -ArgumentList '--native-self-test' -WorkingDirectory $folder -Wait -PassThru
          Write-Host "Native Python.NET self-test exit code: $($process.ExitCode)"
          if (Test-Path $log) {
            Get-Content -Path $log -Tail 65
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Python.NET or WebView2 managed DLL failed to load. Exit code: $($process.ExitCode)"
          }
          Write-Host "Packaged Python.NET and WebView2 managed assembly self-test passed"
      - name: Test real WebView2 window responsiveness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/SkellyMotion').Path
          $exe = Join-Path $folder 'SkellyMotion.exe'
          $log = Join-Path $env:LOCALAPPDATA 'LyricForge/logs/desktop.log'
          Write-Host 'Opening the actual packaged WebView2 editor window'
          $process = Start-Process -FilePath $exe -ArgumentList '--window-self-test' -WorkingDirectory $folder -PassThru
          if (-not $process.WaitForExit(110000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Windows GUI smoke timed out: editor may be frozen'
          }
          Write-Host "Window GUI self-test exit code: $($process.ExitCode)"
          if (Test-Path $log) {
            Get-Content -Path $log -Tail 35
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged WebView2 window failed to load or became unresponsive. Exit code $($process.ExitCode)"
          }
          Write-Host 'Real WebView2 editor window passed the responsiveness check'
      # The release page needs a standalone ZIP. Manual Actions downloads
      # already arrive as an archive, so skip the redundant compression there.
      - name: Package GitHub Release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SkellyMotion -DestinationPath dist/SkellyMotion-Windows-x64.zip -Force
      # Artifacts are ZIP archives automatically. Upload the folder itself,
      # not the release ZIP, so downloads need ONE extraction instead of two.
      - uses: actions/upload-artifact@v4
        with:
          name: SkellyMotion-Windows-x64
          path: dist/SkellyMotion/
          retention-days: 14
          if-no-files-found: error
      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/SkellyMotion-Windows-x64.zip --verify-tag --title "SkellyMotion ${{ github.ref_name }}" --generate-notes
