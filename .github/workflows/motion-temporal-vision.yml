name: Motion full-range shot scouting
on:
  push:
    branches: [staging/motion-temporal-vision-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update -q && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-desktop.txt pytest httpx
      - run: node --check static/autoclip.js && node tests/autoclip_smoke.mjs
      - run: python -m pytest -q tests/test_sequence* tests/test_studio_sequence.py tests/test_creator_expression.py tests/test_voice_direction.py tests/test_voice_alignment.py
