name: Test app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest httpx
      - name: Validate editor JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/autoclip.js
          node --check static/make.js
      - name: Test editor startup and UI actions
        run: |
          node --check static/app.js
          node --check static/autoclip.js
          node --check static/make.js
          node tests/editor_smoke.mjs
          node tests/autoclip_smoke.mjs
          node tests/compressor_lab_smoke.mjs
      - name: Fail fast on Hold and Cut release regressions
        run: python -m pytest tests/test_quick_tools2.py -q -k 'hold or cut'
      - name: Test API, timing and actual MP4 export
        run: python -m pytest tests -q
