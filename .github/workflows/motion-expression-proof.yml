name: Motion expressive production integration
on:
  push:
    branches: [staging/motion-expressive-production-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-expression-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated CPU expression runtime
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu' 'torchaudio==2.6.0+cpu'
          python -m pip install 'chatterbox-tts==0.1.6' pytest pillow psutil fastapi
      - run: sudo apt-get update -q && sudo apt-get install -y ffmpeg
      - name: Verify Creator integration and review
        run: |
          node --check static/autoclip.js
          node tests/autoclip_smoke.mjs
          python -m pytest -q tests/test_creator_expression.py tests/test_voice_direction.py tests/test_voice_alignment.py tests/test_sequence_visual_review.py
      - uses: actions/cache@v4
        with:
          path: expression-model
          key: chatterbox-expression-fcdac3112359983a8dd4a798da91ab87b96006ca
      - name: Generate actual expression audition from pinned model
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
        run: python field-notes/inference/expression_live.py expression-model evidence
          python field-notes/inference/expression_creator_live.py expression-model evidence/creator
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Motion-Expression-Production-Proof
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
