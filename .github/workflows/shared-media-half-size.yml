name: Single shared media stack - half-size release gate
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths:
      - 'packaging/shared-media/**'
      - '.github/workflows/shared-media-half-size.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shared-media-half-size-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm mingw-w64-x86_64-ccache
            mingw-w64-x86_64-x264 mingw-w64-x86_64-libass mingw-w64-x86_64-zlib mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-libvpx mingw-w64-x86_64-dav1d mingw-w64-x86_64-opus mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-ffnvcodec-headers mingw-w64-x86_64-amf-headers mingw-w64-x86_64-libvpl
      - uses: actions/cache/restore@v4
        with:
          path: .shared-ccache
          key: shared-ffmpeg-813-mingw-${{ github.run_id }}
          restore-keys: |
            shared-ffmpeg-813-mingw-
      - name: Build one FFmpeg 8.1.3 shared native stack
        shell: msys2 {0}
        run: bash packaging/shared-media/build_shared_ffmpeg.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .shared-ccache
          key: shared-ffmpeg-813-mingw-${{ github.run_id }}
      - name: Check native CLI with Windows system paths only
        shell: pwsh
        run: |
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
          & ./shared-candidate/vendor/bin/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Shared FFmpeg loader failed' }
          & ./shared-candidate/vendor/bin/ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'Shared FFprobe loader failed' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile exact upstream PyAV source against the same DLLs
        shell: pwsh
        run: |
          python -m pip install 'setuptools>=77' 'cython>=3.1,<4' wheel
          git clone --depth 1 --branch v18.1.1 https://github.com/PyAV-Org/PyAV.git shared-candidate/pyav
          if ($LASTEXITCODE -ne 0) { throw 'PyAV source retrieval failed' }
          $rev=git -C shared-candidate/pyav rev-parse HEAD
          if ($rev -ne 'd12635cad7465c12c16f6b9755800c6c6cc32ae6') { throw 'Wrong PyAV source revision' }
          $rev | Set-Content shared-candidate/build-evidence/pyav-revision.txt
          $vendor=(Resolve-Path shared-candidate/vendor).Path
          $dest=Join-Path (Resolve-Path shared-candidate).Path 'wheel'
          Push-Location shared-candidate/pyav
          try {
            python setup.py "--ffmpeg-dir=$vendor" bdist_wheel --dist-dir $dest
            if ($LASTEXITCODE -ne 0) { throw 'PyAV compilation failed' }
          } finally { Pop-Location }
          git -C shared-candidate/pyav archive --format=zip --output=../pyav-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PyAV source archive failed' }
          $wheel=@(Get-ChildItem $dest -Filter '*.whl' -File)
          if ($wheel.Count -ne 1) { throw 'Expected one PyAV wheel' }
          python -m pip install $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'PyAV installation failed' }
          python -c "import os,sys;h=os.add_dll_directory(sys.argv[1]);import av;print(av.__version__,av.library_versions)" (Join-Path $vendor 'bin')
          if ($LASTEXITCODE -ne 0) { throw 'PyAV shared loader failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-media-build-evidence
          path: shared-candidate/build-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: shared-media-native-and-wheel
          path: |
            shared-candidate/vendor/bin/*.dll
            shared-candidate/vendor/bin/*.exe
            shared-candidate/wheel/*.whl
            shared-candidate/build-evidence/native-sha256.txt
            shared-candidate/ffmpeg-source.tar.gz
            shared-candidate/pyav-source.zip
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: native
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shared-media-native-and-wheel
          path: shared-candidate
      - uses: actions/download-artifact@v4
        with:
          name: SkellyMotion-Consolidated-Windows-x64
          run-id: 46032977554
          github-token: ${{ github.token }}
          path: original
      - uses: actions/download-artifact@v4
        with:
          name: Field-Notes-06-Kokoro-Michael
          run-id: 45948801081
          github-token: ${{ github.token }}
          path: narration
      - name: Install shipped reference AI and app dependencies
        run: python -m pip install -r requirements-desktop.txt "faster-whisper==1.2.1" "av==18.1.1" "ctranslate2==4.9.1" "numpy==2.4.6" "tokenizers==0.23.3" "pywebview==6.2.1" "pythonnet==3.0.5" "clr-loader==0.2.7.post0" pyinstaller pytest httpx
      - name: Generate held-out reference media and pinned Small model
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Get-Location).Path
          python packaging/shared-media/shared_media_proof.py generate original/_internal/tools/ffmpeg.exe narration/take-1.00/narration.wav shared-candidate/fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          python packaging/shared-media/shared_media_proof.py model shared-candidate/model
          if ($LASTEXITCODE -ne 0) { throw 'Pinned model retrieval failed' }
          python packaging/shared-media/shared_media_proof.py snapshot shared-candidate/fixtures shared-candidate/model shared-candidate/evidence/original-ai.json
          if ($LASTEXITCODE -ne 0) { throw 'Original reference inference failed' }
      - name: Replace only PyAV wheel in the experimental build environment
        shell: pwsh
        run: |
          $wheel=@(Get-ChildItem shared-candidate/wheel -Filter '*.whl' -File)
          if ($wheel.Count -ne 1) { throw 'Wrong PyAV wheel artifact' }
          python -m pip uninstall -y av
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove reference wheel from CI environment' }
          python -m pip install --no-deps $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not install experimental wheel' }
          $bin=(Resolve-Path shared-candidate/vendor/bin).Path
          foreach ($line in Get-Content shared-candidate/build-evidence/native-sha256.txt) {
            if ($line -notmatch '^([a-f0-9]{64})\s+\*?([^\/]+)$') { throw 'Invalid native manifest' }
            $file=Join-Path $bin $Matches[2]
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) { throw 'Native file hash mismatch' }
          }
          Add-Content $env:GITHUB_ENV "SKELLY_CI_SHARED_DLL_DIR=$bin"
          Add-Content $env:GITHUB_ENV "PYTHONPATH=$((Resolve-Path packaging/shared-media/source-hook).Path);$((Get-Location).Path)"
          Add-Content $env:GITHUB_PATH $bin
      - name: Compare real PyAV decode, duration, width and Small transcription
        shell: pwsh
        run: |
          python packaging/shared-media/shared_media_proof.py snapshot shared-candidate/fixtures shared-candidate/model shared-candidate/evidence/shared-ai.json --dll-root shared-candidate/vendor/bin
          if ($LASTEXITCODE -ne 0) { throw 'Candidate PyAV inference failed' }
          python packaging/shared-media/shared_media_proof.py compare shared-candidate/evidence/original-ai.json shared-candidate/evidence/shared-ai.json shared-candidate/evidence/source-ai-parity.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate PyAV parity failed' }
      - name: Compare full native CLI feature and rendering parity
        shell: pwsh
        run: |
          python packaging/compact-media/audit_media.py original/_internal/tools/ffmpeg.exe shared-candidate/vendor/bin/ffmpeg.exe shared-candidate/evidence
          if ($LASTEXITCODE -ne 0) { throw 'CLI media compatibility failed' }
          python packaging/compact-media/render_parity.py original/_internal/tools/ffmpeg.exe shared-candidate/vendor/bin/ffmpeg.exe shared-candidate/evidence
          if ($LASTEXITCODE -ne 0) { throw 'CLI rendered-output parity failed' }
      - name: Full Windows regression with candidate media stack
        shell: pwsh
        run: |
          $dir=(Resolve-Path shared-candidate/vendor/bin).Path
          if ((Get-Command ffmpeg).Source -ne (Join-Path $dir 'ffmpeg.exe')) { throw 'Wrong FFmpeg selected' }
          if ((Get-Command ffprobe).Source -ne (Join-Path $dir 'ffprobe.exe')) { throw 'Wrong ffprobe selected' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression failed' }
      - name: Freeze shared stack and reject duplicate DLLs
        shell: pwsh
        run: ./packaging/shared-media/package_shared.ps1 -Vendor shared-candidate/vendor
      - name: Install, prove native UI and real frozen Small inference, enforce half size
        shell: pwsh
        run: ./packaging/shared-media/test_shared_installer.ps1 -Fixtures shared-candidate/fixtures -Model shared-candidate/model -Reference shared-candidate/evidence/original-ai.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-media-half-size-evidence
          path: |
            shared-candidate/evidence/*.json
            shared-candidate/evidence/*.png
            shared-candidate/evidence/*.log
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: SkellyMotion-Half-Size-Windows-Setup
          path: dist/installer/SkellyMotion-Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
