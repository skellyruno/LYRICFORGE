name: Real singing transcription accuracy benchmark
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths: ['packaging/release-audit/singing_benchmark.py','.github/workflows/singing-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: singing-benchmark-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: compact-ffmpeg-runtime-and-source
          run-id: 46040313923
          github-token: ${{ github.token }}
          path: tools
      - run: python -m pip install -r requirements-desktop.txt "faster-whisper==1.2.1" "av==18.1.1" "ctranslate2==4.9.1" "numpy==2.4.6"
      - name: Retrieve public licensed singing and pinned reference model
        shell: pwsh
        run: |
          $env:PYTHONPATH="$((Resolve-Path packaging/shared-media).Path);$((Get-Location).Path)"
          New-Item -ItemType Directory -Force singing-evidence | Out-Null
          python packaging/release-audit/singing_benchmark.py fixtures singing-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Licensed fixture retrieval failed' }
          python packaging/shared-media/shared_media_proof.py model singing-model
          if ($LASTEXITCODE -ne 0) { throw 'Model retrieval failed' }
          python packaging/release-audit/singing_benchmark.py snapshot singing-fixtures singing-model singing-evidence/original.json
          if ($LASTEXITCODE -ne 0) { throw 'Original singing inference failed' }
      - name: Use actual optimized direct candidate
        shell: pwsh
        run: |
          python packaging/direct-media/stage_direct_candidate.py . singing-stage
          if ($LASTEXITCODE -ne 0) { throw 'Stage failed' }
          python -m pip uninstall -y av
          if ($LASTEXITCODE -ne 0) { throw 'Dependency isolation failed' }
          $env:PATH="$((Resolve-Path tools).Path);$env:PATH"
          $env:PYTHONPATH="$((Resolve-Path singing-stage).Path);$((Resolve-Path packaging/shared-media).Path)"
          python packaging/release-audit/singing_benchmark.py snapshot singing-fixtures singing-model singing-evidence/candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate singing inference failed' }
          python packaging/release-audit/singing_benchmark.py compare singing-evidence/original.json singing-evidence/candidate.json singing-evidence/parity.json
          if ($LASTEXITCODE -ne 0) { throw 'Singing parity failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: singing-accuracy-evidence
          path: singing-evidence/*.json
          if-no-files-found: warn
