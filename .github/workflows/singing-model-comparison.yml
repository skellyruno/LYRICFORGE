name: Optional larger Whisper model singing comparison
on:
  push:
    branches: [feature/field-notes-production-20261126]
    paths: ['packaging/release-audit/singing_model_comparison.py','.github/workflows/singing-model-comparison.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: singing-model-comparison-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/field-notes-production-20261126' }}
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: heldout-singing-accuracy-evidence
          run-id: 46068520345
          github-token: ${{ github.token }}
          path: prior-sweep
      - uses: actions/download-artifact@v4
        with:
          name: compact-ffmpeg-runtime-and-source
          run-id: 46040313923
          github-token: ${{ github.token }}
          path: tools
      - run: python -m pip install -r requirements-desktop.txt "faster-whisper==1.2.1" "av==18.1.1" "ctranslate2==4.9.1" "numpy==2.4.6"
      - name: Compare actual direct-backend Small vs Medium on same recordings
        shell: pwsh
        run: |
          python packaging/direct-media/stage_direct_candidate.py . singing-stage
          if ($LASTEXITCODE -ne 0) {throw 'Candidate staging failed'}
          python -m pip uninstall -y av
          if ($LASTEXITCODE -ne 0) {throw 'Candidate isolation failed'}
          $env:PATH="$((Resolve-Path tools).Path);$env:PATH"
          $env:PYTHONPATH="$((Resolve-Path singing-stage).Path);$((Resolve-Path packaging/shared-media).Path)"
          python packaging/release-audit/singing_model_comparison.py prior-sweep/singing-accuracy-sweep.json model-evidence
          if ($LASTEXITCODE -ne 0) {throw 'Model comparison failed'}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: singing-model-comparison-evidence
          path: model-evidence/*.json
          if-no-files-found: warn
